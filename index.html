<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #0e1116;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
    }
    main { width: min(100%, 460px); margin: 0 auto; }
    h1 { font-size: 44px; line-height: 1; margin: 0 0 18px; letter-spacing: -0.04em; }
    p, li { font-size: 22px; line-height: 1.35; }
    ol { margin: 0; padding: 0; list-style: none; }
    li { margin: 0 0 16px; padding-left: 46px; position: relative; }
    li span {
      position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%;
      background: #f4f1ea; color: #0e1116; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    button {
      appearance: none; width: 100%; margin-top: 8px; border: 0; border-radius: 18px;
      background: #f4f1ea; color: #0e1116; font: inherit; font-size: 24px; font-weight: 700;
      padding: 20px 16px;
    }
    button:disabled { opacity: 0.55; }
    .erro { color: #ffb4a8; }
  </style>
</head>
<body>
  <main id="tela"><h1>Jarvis</h1><p>Abrindo…</p></main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
